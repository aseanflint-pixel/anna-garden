<text x="180.0" y="40" text-anchor="middle" font-size="22" font-weight="bold" fill="#fff">LOST DOG: BISCUIT</text>
<text x="18" y="84" font-size="15" font-weight="bold" fill="#222">Small brown dog with a white patch on its left ear</text>
<text x="18" y="110" font-size="13" font-weight="normal" fill="#222">Last seen: near the bus interchange on Monday morning</text>
<text x="18" y="136" font-size="13" font-weight="normal" fill="#222">Wearing a red collar with a small bell</text>
<text x="18" y="162" font-size="13" font-weight="normal" fill="#222">Biscuit is friendly but shy. Please do not chase him.</text>
<text x="18" y="188" font-size="13" font-weight="normal" fill="#222">If you see him, call Mrs Koh at 9123 4567.</text>
<text x="18" y="214" font-size="13" font-weight="bold" fill="#222">REWARD: $50 for information that helps us find Biscuit</text>
