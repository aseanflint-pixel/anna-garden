<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 364" width="360" height="364" font-family="Noto Sans CJK SC, sans-serif">
<rect x="4" y="4" width="352" height="356" rx="12" fill="#fffef7" stroke="#1d4e89" stroke-width="3"/>
<rect x="4" y="4" width="352" height="50" rx="12" fill="#1d4e89"/>
<text x="180.0" y="38" text-anchor="middle" font-size="21" font-weight="bold" fill="#fff">社区图书馆通知</text>
<text x="16" y="80" font-size="15" fill="#222">亲爱的读者：</text>
<text x="16" y="104" font-size="15" fill="#222">为了给大家更舒适的阅读环境，本馆将于6月1</text>
<text x="16" y="128" font-size="15" fill="#222">日至6月7日进行装修，暂停开放。</text>
<text x="16" y="152" font-size="15" fill="#222">装修期间，读者可以到附近的东区图书馆借书和</text>
<text x="16" y="176" font-size="15" fill="#222">还书。</text>
<text x="16" y="200" font-size="15" fill="#222">6月8日起，本馆恢复开放，开放时间改为上午</text>
<text x="16" y="224" font-size="15" fill="#222">9时至晚上9时。</text>
<text x="16" y="248" font-size="15" fill="#222">新的儿童阅读区每星期六下午3时有讲故事活动</text>
<text x="16" y="272" font-size="15" fill="#222">，欢迎6至10岁的小朋友参加。</text>
<text x="16" y="296" font-size="15" fill="#222">如有问题，请拨打 6123 4567。</text>
<text x="16" y="320" font-size="15" fill="#222">社区图书馆　5月20日</text>
</svg>