<!DOCTYPE html>
<html lang="zh-Hans">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>安安的知识花园 · 五年级</title>
<style>
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
:root{--ink:#2c3a2e;--soil:#8a5a32;--leaf:#3f8f4b;--paper:#fbf6ea;--wood:#6b4423;}
html,body{
  min-height:100%;
  color:var(--ink);
  font-family:"Nunito","Quicksand","Noto Sans CJK SC","Noto Sans SC","PingFang SC",sans-serif;
  background:linear-gradient(180deg,#b9e4f8 0%,#e8f6c9 38%,#cfe8a0 70%,#b4d67a 100%);
}
body{display:flex;flex-direction:column;min-height:100vh;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.save-bar{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;
  padding:8px 12px;background:#35582a;color:#e8f6c9;position:relative;z-index:5;
}
.save-bar button{
  min-height:44px;padding:8px 14px;border-radius:999px;font-weight:800;font-size:.88rem;
  background:rgba(255,255,255,.14);color:#fffef6;
}
.save-bar button:hover{background:rgba(255,255,255,.24)}
.save-bar button.primary{background:#f0c43a;color:#3d2a04}
.save-bar button.primary:hover{filter:brightness(1.05)}
.save-bar button.danger{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.4)}
.save-bar .last-saved{font-size:12px;font-weight:800}
.topic-meter{font-weight:800;margin:0 0 12px;color:#35582a;line-height:1.45}
.btn-master{
  display:block;width:100%;margin-top:10px;padding:12px 16px;border-radius:16px;
  background:#f0c43a;color:#3d2a04;font-weight:800;font-size:1rem;
  box-shadow:0 5px 0 #c49216;
}
.btn-master:hover{filter:brightness(1.05)}
.btn-master:active{transform:translateY(2px);box-shadow:0 3px 0 #c49216}
.btn-master.is-on{background:#e9f6e0;color:#1d3d18;box-shadow:0 5px 0 #b7d9a6}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
  max-width:min(440px, calc(100% - 24px));
  background:#35582a;color:#fffef6;padding:12px 18px;border-radius:999px;
  font-weight:800;z-index:95;box-shadow:0 10px 24px rgba(0,0,0,.22);text-align:center;
}
.toast[hidden]{display:none !important}
.confirm{position:fixed;inset:0;z-index:110}
.confirm[hidden]{display:none !important}
.confirm-backdrop{position:absolute;inset:0;background:rgba(20,16,30,.45)}
.confirm-card{
  position:relative;z-index:1;margin:22vh auto 0;width:min(420px, calc(100% - 32px));
  background:#fffef6;border-radius:24px;padding:22px 20px 18px;
  box-shadow:0 24px 50px rgba(0,0,0,.25);
}
.confirm-card h2{font-size:1.25rem;margin-bottom:8px}
.confirm-card p{font-weight:700;line-height:1.45;margin-bottom:16px}
.confirm-actions{display:flex;gap:8px}
.confirm-actions button{
  flex:1;min-height:48px;border-radius:14px;font-weight:800;
  background:#eef6e0;color:#35582a;
}
.confirm-actions button.danger{background:#9a3b00;color:#fff}

.app-header{padding:12px 20px 8px;width:min(1180px,100%);margin:0 auto}
.header-row{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.sign{
  background:linear-gradient(180deg,#c9853a,#8c5520);color:#fff8e6;
  border-radius:8px 8px 14px 14px;padding:12px 18px 14px;
  box-shadow:0 8px 0 #5c3814,inset 0 2px 0 rgba(255,255,255,.25);
  position:relative;min-width:240px;
}
.sign::before,.sign::after{content:"";position:absolute;top:-16px;width:10px;height:22px;background:#6b4423;border-radius:3px;box-shadow:inset 0 0 0 2px #5a3918}
.sign::before{left:22px}.sign::after{right:22px}
.sign .eyebrow{font-size:11px;letter-spacing:.12em;font-weight:800;opacity:.8}
.sign h1{font-size:1.4rem;font-weight:800;letter-spacing:.02em}
.subject-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto;padding-bottom:6px}
.subject-tabs button{padding:8px 14px;border-radius:999px;font-weight:800;font-size:.92rem;background:#fffef6;border:2px solid #c9dc9a;color:#35582a}
.subject-tabs button[aria-selected="true"]{background:#35582a;color:#fffef6;border-color:#35582a}
.subject-tabs button.is-soon{opacity:.7}
.subject-tabs button.is-soon small{display:block;font-size:9px}

.vitals{
  display:grid;grid-template-columns:180px 1fr;gap:16px;align-items:center;
  margin:10px 0 0;background:rgba(255,254,246,.75);border-radius:24px;
  padding:12px 16px;border:1px solid rgba(53,88,42,.08);
}
.tree-wrap{display:grid;place-items:center}
.tree-wrap svg{width:150px;height:150px}
.stats-col{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{text-align:center;padding:6px 4px;overflow:visible}
.stat .k{font-size:11px;font-weight:800;opacity:.6;letter-spacing:.04em}
.stat .v{font-size:1.5rem;font-weight:800;line-height:1.25;overflow:visible}
.stat .unit{display:block;margin-top:2px;font-size:12px;font-weight:800;font-family:"Noto Sans CJK SC","Noto Sans SC",sans-serif}
.stat.done .v{color:#1d7a3a}
.stat.remain .v{color:#b8610a}
.stat.todo .v{color:#1d4e89}
.bar-wrap{grid-column:1/-1;height:12px;background:#e4efd4;border-radius:999px;overflow:hidden}
.bar-wrap span{display:block;height:100%;width:var(--p);background:linear-gradient(90deg,#3f8f4b,#f0c43a);border-radius:999px}
.hint{grid-column:1/-1;font-size:13px;font-weight:700;color:#35582a;text-align:center;margin-top:2px}

.layout{flex:1;width:min(1180px,100%);margin:0 auto;padding:8px 16px 28px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.garden{
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,.08));
  border-radius:32px;padding:20px 16px 28px;border:1px solid rgba(255,255,255,.5);
  box-shadow:0 16px 30px rgba(53,88,42,.1);position:relative;overflow:hidden;
}
.butterflies{position:absolute;inset:0;pointer-events:none}
.bf{position:absolute;font-size:18px;animation:flit 7s ease-in-out infinite}
.bf.b1{top:12%;left:10%;animation-delay:-1s}
.bf.b2{top:22%;right:16%;animation-delay:-3s;font-size:14px}
.bf.b3{top:6%;left:78%;animation-delay:-5s;font-size:16px}
@keyframes flit{0%,100%{transform:translate(0,0) rotate(-8deg)}50%{transform:translate(18px,-12px) rotate(10deg)}}
.plots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px 14px;position:relative;z-index:1}
.plot{background:transparent;text-align:center;padding:6px 4px 8px;border-radius:18px}
.plot:hover .pot,.plot:focus-visible .pot{transform:translateY(-4px)}
.plant{height:118px;display:grid;place-items:end center;position:relative}
.plant svg{width:110px;height:118px;overflow:visible}
.pot{width:78px;height:28px;margin:0 auto;background:linear-gradient(180deg,#d9a066,#b36b38);border-radius:0 0 18px 18px;box-shadow:0 6px 0 #8a4e24,inset 0 4px 0 #e8bc86;position:relative;z-index:1;transition:transform .15s ease}
.pot::before{content:"";position:absolute;left:-6px;right:-6px;top:-8px;height:12px;background:#c9844a;border-radius:6px;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}
.soil{position:absolute;left:10px;right:10px;top:-2px;height:8px;background:#6b4223;border-radius:8px;z-index:2}
.plot.locked .pot{filter:grayscale(.6) brightness(.95)}
.label-zh{font-weight:800;font-size:.92rem;margin-top:8px;line-height:1.25}
.label-en{font-size:11px;opacity:.6;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.tag{display:inline-block;margin-top:4px;font-size:10px;font-weight:800;padding:1px 8px;border-radius:999px;background:rgba(255,255,255,.75)}
.plot.conquered .tag{background:#fff3a8;color:#7a4e00}
.plot.progress .tag{background:#ffe1c4;color:#9a3b00}
.plot.todo .tag{background:#d8ecff;color:#0a4f8a}
.plot.locked .tag{background:#eceae6;color:#5c5c5c}

.side{position:sticky;top:16px;background:#fffef6;border-radius:24px;padding:16px;box-shadow:0 10px 24px rgba(53,88,42,.1);border:1px solid rgba(53,88,42,.08);max-height:calc(100vh - 24px);overflow:auto}
.side h2{font-size:1.05rem}
.side .sub{font-size:12px;opacity:.65;margin:4px 0 12px}
.seed-item{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:center;width:100%;text-align:left;padding:9px 8px;border-radius:14px;background:#f3efe0;margin-bottom:8px}
.seed-item:hover{background:#efe4b8}
.seed-item .ico{font-size:18px;text-align:center}
.seed-item .zh{font-weight:800;font-size:.9rem;display:block}
.seed-item .en{font-size:11px;opacity:.6}
.seed-item .st{font-size:10px;font-weight:800;opacity:.7}
.legend{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:8px;padding-top:10px;border-top:1px dashed #d7ccae;font-size:11px;font-weight:800;opacity:.8}
.coming-soon-card{margin:8px;padding:28px;border-radius:24px;text-align:center;background:#fffef6}
.cs-badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:800;margin-bottom:10px;background:#e8f6c9}

#modal{position:fixed;inset:0;z-index:80}
#modal[hidden]{display:none !important}
.modal-backdrop{position:absolute;inset:0;background:rgba(20,16,30,.45);backdrop-filter:blur(4px)}
.modal-card{position:relative;z-index:1;margin:8vh auto 0;width:min(520px,calc(100% - 32px));max-height:min(84vh,720px);overflow:auto;padding:28px 26px 24px;border-radius:28px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.22);animation:pop .28s ease}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-x{position:absolute;top:12px;right:12px;z-index:3;width:40px;height:40px;border-radius:50%;font-size:26px;line-height:1;background:#f3f1ee;color:#444}
.modal-kicker{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.6;font-weight:700;margin-bottom:8px;padding-right:36px}
.modal-card h2{font-size:1.55rem;line-height:1.25;margin-bottom:4px;padding-right:36px}
.modal-en{opacity:.65;margin-bottom:12px;font-size:.95rem}
.modal-status{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.pill{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
.status-conquered .pill{background:#ffe8a3;color:#7a4e00}
.status-progress .pill{background:#ffe1c4;color:#9a3b00}
.status-todo .pill{background:#d8ecff;color:#0a4f8a}
.status-locked .pill{background:#eceae6;color:#5c5c5c}
.stars{letter-spacing:1px;font-size:16px}
.star{color:#d9d3c8}.star.on{color:#f5b301}
.modal-lead{font-weight:700;margin-bottom:8px}
.modal-los{padding-left:18px;list-style:disc;display:grid;gap:6px;margin-bottom:18px;color:#333}
.btn-practice{display:block;width:100%;padding:14px 18px;border-radius:16px;background:#1f6f5a;color:#fff;font-weight:800;font-size:1rem;box-shadow:0 6px 0 #155445}
.btn-practice:hover{filter:brightness(1.05)}
.btn-practice:active{transform:translateY(2px);box-shadow:0 4px 0 #155445}
.btn-practice:disabled{background:#c9c4bb;color:#6a655e;box-shadow:none;cursor:not-allowed;filter:none}
.practice-note{margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff6d8;color:#6b4e00;font-size:.9rem}
body.modal-open{overflow:hidden}
.page-foot{width:min(1180px,100%);margin:0 auto;padding:0 16px 24px;font-size:12px;color:#35582a;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-foot a{color:#35582a;font-weight:800}

@media (max-width:860px){
  .layout{grid-template-columns:1fr;padding:8px 10px 24px}
  .side{position:relative;top:auto;max-height:210px;order:-1}
  .vitals{grid-template-columns:72px 1fr;padding:10px;gap:8px}
  .tree-wrap svg{width:72px;height:72px}
  .stats-col .v{font-size:1.15rem}
  .plots{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 8px}
  .plant{height:100px}
  .plant svg{width:90px;height:100px}
  .header-row{align-items:stretch}
  .subject-tabs{margin-left:0;width:100%}
  .label-en{display:none}
  .hint{font-size:12px}
  .save-bar{gap:6px;padding:8px 8px 10px}
  .save-bar button{font-size:.8rem;padding:8px 10px}
  .save-bar .last-saved{flex:1 1 100%;text-align:center}
  .confirm-card{margin:18vh auto 0}
}
.load-error{margin:40px auto;width:min(520px,90%);background:#fffef6;padding:24px;border-radius:20px;text-align:center}
.grade-switch{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:2px;margin-top:8px;padding:3px;border-radius:22px;background:rgba(61,38,20,.35)}
.grade-switch a{display:inline-flex;align-items:center;min-height:40px;padding:6px 10px;border-radius:999px;font-weight:800;font-size:.9rem;color:#fff8e6;text-decoration:none}
.grade-switch a[aria-current="page"]{background:#f0c43a;color:#3d2a04;box-shadow:0 2px 0 #c49216}
.grade-switch a:focus-visible{outline:3px solid #fffef6;outline-offset:2px}
</style>
<script>/* 四年级 / 五年级: remember the last grade on this device (own key; progress keys untouched) */
(function(){ var K = "anna-garden.grade.v1", here = "P5";
  try{ var P = {"P2": "p2.html", "P3": "p3.html", "P5": "p5.html"}, last = localStorage.getItem(K);
    if(here === "P4" && P[last] && !/[?&]grade=4/.test(location.search)){ location.replace(P[last] + location.hash); return; } localStorage.setItem(K, here); }catch(e){}
  document.addEventListener("click", function(e){ var a = e.target.closest && e.target.closest(".grade-switch a"); if(a){ try{ localStorage.setItem(K, a.getAttribute("data-grade")); }catch(err){} } }, true);
})();</script>

/* Progress: 5 different questions marked 做对了 bloom a topic (fewer if the bank is smaller).
   我学会了 forces 100%. 做错了 on a question that was right lowers it again.
   Overall 学会了 is the average of topic percents. 还没开花 counts topics under 100%. */
const PROGRESS_KEY = "anna-garden.p5.progress.v1";   // 五年级 has its own practice record; the P4 record is never read or written here
// Progress saved before the original question bank (any record without this tag) is copied once to OLD_PROGRESS_KEY and the garden starts from zero.
const BANK_EPOCH = "p5-original-1";
const OLD_PROGRESS_KEY = "anna-garden.p5.progress.v1.before-original";
const MASTER_GOAL = 5;
let DATA = null;
let current = "math";
let store = { version:1, savedAt:null, topics:{} };
let toastTimer = null;
let confirmResolver = null;

function emptyStore(){ return { version:1, bank:BANK_EPOCH, savedAt:null, topics:{}, open:{} }; }
function knownQ(qid){ const b = window.PRACTICE_BANK; return !!(b && b.idIndex && Object.prototype.hasOwnProperty.call(b.idIndex, qid)); }
function knownTopic(id){
  return !!(DATA && DATA.topics && DATA.topics.some(t => t.topic_id === id));
}
function sanitizeStore(obj){
  if(!obj || typeof obj !== "object" || Array.isArray(obj)) throw new Error("bad");
  if(obj.version !== 1) throw new Error("version");
  if(obj.bank !== BANK_EPOCH) throw new Error("old-bank");
  if(!obj.topics || typeof obj.topics !== "object" || Array.isArray(obj.topics)) throw new Error("topics");
  const BAD = ["__proto__", "constructor", "prototype"];
  const topics = {};
  // Entries from the earlier question bank (unknown question ids or flowers) are kept untouched but ignored by every count.
  Object.keys(obj.topics).forEach(id => {
    if(BAD.includes(id)) return;
    const rec = obj.topics[id];
    if(!rec || typeof rec !== "object" || Array.isArray(rec)) return;
    const marks = {};
    const src = rec.marks && typeof rec.marks === "object" && !Array.isArray(rec.marks) ? rec.marks : {};
    Object.keys(src).forEach(qid => {
      if(BAD.includes(qid)) return;
      if(src[qid] === "right" || src[qid] === "wrong" || src[qid] === "partial") marks[qid] = src[qid];
    });
    topics[id] = { marks, mastered: rec.mastered === true };
  });
  const open = {};
  const so = obj.open && typeof obj.open === "object" && !Array.isArray(obj.open) ? obj.open : {};
  Object.keys(so).forEach(qid => {
    if(BAD.includes(qid) || !knownQ(qid)) return;
    const r = so[qid];
    if(!r || typeof r !== "object" || typeof r.text !== "string" || !knownTopic(r.topic)) return;
    const st = ["pending", "right", "partial", "wrong"].includes(r.status) ? r.status : "pending";
    open[qid] = { topic:r.topic, text:r.text.slice(0, 4000), status:st,
      at: typeof r.at === "string" ? r.at : null, checkedAt: typeof r.checkedAt === "string" ? r.checkedAt : null };
    if(r.parts && typeof r.parts === "object" && !Array.isArray(r.parts)){
      const ps = {};
      Object.keys(r.parts).forEach(k => {
        const p = r.parts[k];
        if(!/^\d+$/.test(k) || !p || typeof p !== "object") return;
        ps[k] = { text: typeof p.text === "string" ? p.text.slice(0, 2000) : "", auto: p.auto === true,
          status: ["pending", "right", "partial", "wrong"].includes(p.status) ? p.status : "pending" };
      });
      open[qid].parts = ps;
    }
    if(r.revealed === true) open[qid].revealed = true;
  });
  let savedAt = null;
  if(typeof obj.savedAt === "string" && !Number.isNaN(Date.parse(obj.savedAt))){
    savedAt = new Date(obj.savedAt).toISOString();
  }
  return { version:1, bank:BANK_EPOCH, savedAt, topics, open };
}
function readStore(){
  let raw = null;
  try{ raw = localStorage.getItem(PROGRESS_KEY); }catch(e){ return emptyStore(); }
  if(!raw) return emptyStore();
  let obj = null;
  try{ obj = JSON.parse(raw); }catch(e){ obj = null; }
  if(!obj || obj.bank !== BANK_EPOCH){
    // earlier question bank: keep one copy aside, then start the new garden from zero (old 我学会了 flags included)
    try{ if(!localStorage.getItem(OLD_PROGRESS_KEY)) localStorage.setItem(OLD_PROGRESS_KEY, raw); }catch(e){}
    const fresh = emptyStore();
    try{ localStorage.setItem(PROGRESS_KEY, JSON.stringify(fresh)); }catch(e){}
    return fresh;
  }
  try{ return sanitizeStore(obj); }catch(e){ return emptyStore(); }
}
function stampParts(iso){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone:"Asia/Singapore", month:"numeric", day:"numeric",
    hour:"2-digit", minute:"2-digit", hourCycle:"h23"
  }).formatToParts(new Date(iso));
  const get = (type) => (parts.find(p => p.type === type) || {}).value || "";
  return { month:get("month"), day:get("day"), hour:get("hour"), minute:get("minute") };
}
function formatSaved(iso){
  if(!iso) return T("save.never");
  return I18N.dateText(stampParts(iso));
}
function formatClock(iso){
  const p = stampParts(iso);
  return p.hour + ":" + p.minute;
}

function writeStore(opts){

  store.bank = BANK_EPOCH;
  if(!opts.keepSavedAt || !store.savedAt) store.savedAt = new Date().toISOString();

}
function ensureRec(topicId){
  if(!store.topics[topicId]) store.topics[topicId] = { marks:{}, mastered:false };
  if(!store.topics[topicId].marks) store.topics[topicId].marks = {};
  return store.topics[topicId];
}
function questionCountFor(topicId){
  const t = DATA && DATA.topics ? DATA.topics.find(x => x.topic_id === topicId) : null;
  const b = window.PRACTICE_BANK;
  if(!t || !b || !b.questions) return 0;
  const ids = [t.topic_id].concat((t.learning_outcomes || []).map(lo => lo.topic_id));
  const seen = {};
  let n = 0;
  const subj = t.bank_subject || "";
  ids.forEach(id => {
    const idxs = (b.byTopic && b.byTopic[id]) || [];
    idxs.forEach(i => {
      if(seen[i]) return;
      seen[i] = true;
      const q = b.questions[i];
      if(q && (!subj || !q.subject || q.subject === subj)) n += 1;
    });
  });
  return n;
}
function goalFor(topicId){
  const n = questionCountFor(topicId);
  if(n <= 0) return 0;
  return Math.min(MASTER_GOAL, n);
}
function rightCount(topicId){
  const rec = store.topics[topicId];
  if(!rec || !rec.marks) return 0;
  // 对 = 1, 部分对 = 0.5, 不对 = 0
  return Object.keys(rec.marks).reduce((n, id) => n + (!knownQ(id) ? 0 : rec.marks[id] === "right" ? 1 : rec.marks[id] === "partial" ? 0.5 : 0), 0);
}
function percentFor(topicId){
  const rec = store.topics[topicId];
  if(rec && rec.mastered) return 100;
  const goal = goalFor(topicId);
  if(goal <= 0) return 0;
  const right = Math.min(goal, rightCount(topicId));
  return Math.max(0, Math.min(100, Math.round(100 * right / goal)));
}
function isMastered(topicId){
  return !!(store.topics[topicId] && store.topics[topicId].mastered);
}
function getMark(topicId, qid){
  const rec = store.topics[topicId];
  if(!rec || !rec.marks) return null;
  return rec.marks[qid] || null;
}
function statusFor(pct){
  if(pct >= 100) return "conquered";
  if(pct > 0) return "progress";
  return "todo";
}
function starsFor(pct){
  if(pct >= 100) return 3;
  if(pct >= 60) return 2;
  if(pct >= 20) return 1;
  return 0;
}
function statusText(t){
  if(t.percent >= 100) return T("status.conquered");
  if(t.percent > 0) return T("status.progress", { p: t.percent });
  return T("status.todo");
}
function decorate(t){
  const percent = percentFor(t.topic_id);
  return Object.assign({}, t, { percent, status: statusFor(percent), stars: starsFor(percent) });
}
function markQuestion(topicId, qid, result){
  if((result !== "right" && result !== "wrong") || !qid || !knownTopic(topicId)) return percentFor(topicId);
  const bq = bankQ(String(qid));
  if(bq && (bq.mode === "parent" || bq.mode === "multi")) return percentFor(topicId); // open-ended answers are only marked in 家长确认
  const rec = ensureRec(topicId);
  rec.marks[String(qid)] = result;
  if(result === "wrong") rec.mastered = false;
  writeStore();
  render();
  return percentFor(topicId);
}
function nowIso(){ return new Date().toISOString(); }
function getOpen(qid){ return (store.open && store.open[qid]) || null; }
function submitOpen(topicId, qid, text){
  if(!knownTopic(topicId) || !knownQ(qid)) return;
  if(!store.open) store.open = {};
  store.open[qid] = { topic:topicId, text:String(text).slice(0, 4000), status:"pending", at:nowIso(), checkedAt:null };
  const rec = ensureRec(topicId); delete rec.marks[qid];
  writeStore(); render();
}
function withdrawOpen(qid){
  const r = getOpen(qid); if(!r) return;
  delete store.open[qid];
  if(store.topics[r.topic] && store.topics[r.topic].marks) delete store.topics[r.topic].marks[qid];
  writeStore(); render();
}
/* ---------- open answers, multi-part answers, parent marking ----------
   Multi-part questions keep one record with a status per part. Auto parts (exact values) are right/wrong at once;
   the other parts wait for 家长确认. The item rolls up: all parts right = 对, none = 不对, otherwise 部分对 (½ credit). */
function rollupParts(r){
  const ks = Object.keys(r.parts || {});
  if(!ks.length || ks.some(k => r.parts[k].status === "pending")) return "pending";
  const s = ks.reduce((n, k) => n + (r.parts[k].status === "right" ? 1 : r.parts[k].status === "partial" ? 0.5 : 0), 0);
  return s === ks.length ? "right" : (s === 0 ? "wrong" : "partial");
}
function applyOpen(qid, r){
  const rec = ensureRec(r.topic);
  if(r.parts) r.status = rollupParts(r);
  if(r.status === "pending"){ delete rec.marks[qid]; r.checkedAt = null; }
  else { rec.marks[qid] = r.status; r.checkedAt = nowIso(); if(r.status === "wrong") rec.mastered = false; }
}
function confirmOpen(qid, result, part){
  if(!isParentUnlocked()) return false;
  const r = getOpen(qid); if(!r || r.revealed) return false;
  if(result === "pending"){
    if(r.parts) Object.keys(r.parts).forEach(k => { if(!r.parts[k].auto) r.parts[k].status = "pending"; });
    else r.status = "pending";
  } else if(result === "right" || result === "partial" || result === "wrong"){
    if(r.parts){
      const p = r.parts[String(part)];
      if(!p || p.auto) return false;
      p.status = result;
    } else r.status = result;
  } else return false;
  applyOpen(qid, r);
  writeStore(); render();
  return true;
}
function submitMulti(topicId, qid, answers){
  const q = bankQ(qid);
  if(!q || q.mode !== "multi" || !knownTopic(topicId) || !Array.isArray(answers) || answers.length !== q.parts.length) return false;
  const parts = {};
  q.parts.forEach((p, i) => {
    const a = answers[i] || {};
    const auto = p.kind === "exact";
    parts[i] = { text:String(a.text || "").slice(0, 2000), auto, status: auto ? (a.result === "right" ? "right" : "wrong") : "pending" };
  });
  if(!store.open) store.open = {};
  const r = { topic:topicId, text:q.parts.map((p, i) => ((p.label || p.prompt || "") + " " + parts[i].text).trim()).join("\n").slice(0, 4000),
    status:"pending", at:nowIso(), checkedAt:null, parts };
  store.open[qid] = r;
  applyOpen(qid, r);
  writeStore(); render();
  return true;
}
/* looking at the answer before answering counts as not correct */
function revealUnanswered(topicId, qid){
  const q = bankQ(qid); if(!q || !knownTopic(topicId)) return false;
  if(q.mode === "parent" || q.mode === "multi"){
    if(getOpen(qid)) return false;
    if(!store.open) store.open = {};
    store.open[qid] = { topic:topicId, text:"", status:"wrong", revealed:true, at:nowIso(), checkedAt:null };
  }
  const rec = ensureRec(topicId); rec.marks[qid] = "wrong"; rec.mastered = false;
  writeStore(); render();
  return true;
}
function openList(){
  const o = store.open || {};
  return Object.keys(o).map(qid => Object.assign({ qid }, o[qid]))
    .sort((a, b) => String(b.checkedAt || b.at || "").localeCompare(String(a.checkedAt || a.at || "")));
}
function updateParentBadge(){

}
function setMastered(topicId, yes){
  if(!knownTopic(topicId)) return;
  const rec = ensureRec(topicId);

function topicsOf(data, sid){
  return data.topics.filter(t => t.subject_id === sid).map(decorate);
}
function statsOf(data, sid){
  const ts = topicsOf(data, sid);
  const total = ts.length;
  const done = ts.filter(t => t.percent >= 100).length;
  const sum = ts.reduce((a, t) => a + (t.percent || 0), 0);
  const donePct = total ? Math.round(sum / total) : 0;
  return {
    done, total, donePct,
    remainPct: total ? Math.max(0, 100 - donePct) : 0,
    unfinished: ts.filter(t => t.percent < 100)
  };
}

}
function importProgress(file){
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const data = JSON.parse(String(reader.result || ""));
      const incoming = sanitizeStore(data);      // checked first; the current progress is not touched yet
      const yes = await askReset("import");      // final confirm, after the PIN
      if(!yes || !canResetProgress()){ revokeReset(); return; }
      revokeReset(); lockParent();
      store = incoming;
      if(!store.savedAt) store.savedAt = new Date().toISOString();
      writeStore({ toast:false, keepSavedAt:true });
      closeModal();
      render();
      toast(T("toast.imported", { time: formatClock(store.savedAt) }));
    }catch(e){
      toast(e && e.message === "old-bank" ? T("toast.importOld") : T("toast.importBad"));
    }
  };
  reader.onerror = () => toast(T("toast.importBad"));
  reader.readAsText(file);
}
function bindSaveBar(){
  $("#btn-save").addEventListener("click", () => writeStore({ toast:true }));
  $("#btn-parent").addEventListener("click", () => { if(window.openParentReview) window.openParentReview(); });
  $("#btn-export").addEventListener("click", exportProgress);
  // loading a file overwrites all progress, so it needs the parent PIN first (set one first if there is none)
  $("#btn-import").addEventListener("click", () => {
    requireResetGate("save.import", () => { markPickerOpen(); $("#import-file").click(); });
  });
  $("#import-file").addEventListener("change", (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if(file) importProgress(file); else revokeReset();
  });
  $("#btn-reset").addEventListener("click", () => {
    requireResetGate("save.reset", async () => {
      const yes = await askReset("reset");
      if(yes) resetProgress(); else revokeReset();
    });
  });
}
function bootGarden(){
  try{
    DATA = window.GARDEN_DATA;
    if(!DATA || !DATA.topics) throw new Error(T("err.topics"));
    store = readStore();
    current = (DATA.subjects.find(s => !s.coming_soon) || DATA.subjects[0]).subject_id;
    bindSaveBar();
    updateSavedLabel();

    document.addEventListener("garden:lang", () => {

    });
  }catch(err){
    const main = document.querySelector("main");
    if(main) main.innerHTML = `<div class="load-error"><p>${T("err.data")}</p><p>${err.message}</p></div>`;
  }
}
/* ---------- parent PIN (家长确认) ----------
   The PIN is chosen by the parent on this device. Only a salted, repeated SHA-256 hash is kept in localStorage.
   Marking open-ended answers (confirmOpen) only works while the parent view is unlocked. */
const PARENT_KEY = "anna-garden.parent.v1";
const PARENT_PHRASE = "我是家长";
window.GARDEN_PARENT_PHRASE = PARENT_PHRASE;  // shown in the PIN screens (it is a Chinese phrase in both languages)
const PIN_ROUNDS = 4000;
let parentUnlocked = false;
const LOCK_KEY = "anna-garden.pinlock.v1";   // wrong-PIN counter and lockout survive a page reload
const PIN_MAX_FAILS = 5, PIN_LOCK_MS = 5 * 60 * 1000;
function readLock(){
  try{ const o = JSON.parse(localStorage.getItem(LOCK_KEY) || "null"); return { fails:Number(o && o.fails) || 0, until:Number(o && o.until) || 0 }; }
  catch(e){ return { fails:0, until:0 }; }
}
function writeLock(fails, until){ try{ localStorage.setItem(LOCK_KEY, JSON.stringify({ fails, until })); }catch(e){} }
/* ---- reset permission ----
   FUTURE (not built yet): registration + login. Then canResetProgress() will check the signed-in account
   (the account owner or a parent), and the PIN gate below goes away. Password change will then work by an email link sent
   to the registered address, replacing the typed 我是家长 recovery. Nothing else needs to change: every reset/import path asks only this function. */
let resetGrantUntil = 0, pickerUntil = 0;
function canResetProgress(){
  return hasPin() && Date.now() < resetGrantUntil;   // set only by a correct PIN (or by choosing the very first PIN), never by 我是家长
}
function grantReset(){ resetGrantUntil = Date.now() + 3 * 60 * 1000; }
function revokeReset(){ resetGrantUntil = 0; pickerUntil = 0; }
function markPickerOpen(){ pickerUntil = Date.now() + 3 * 60 * 1000; }  // the phone's file chooser may hide the page; keep the grant meanwhile
function sha256hex(str){
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,
    0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,
    0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,
    0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,
    0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 255);
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
  const W = new Array(64);
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for(let off = 0; off < bytes.length; off += 64){
    for(let i = 0; i < 16; i++) W[i] = (bytes[off + 4*i] << 24) | (bytes[off + 4*i + 1] << 16) | (bytes[off + 4*i + 2] << 8) | bytes[off + 4*i + 3];
    for(let i = 16; i < 64; i++){
      const s0 = rotr(W[i-15], 7) ^ rotr(W[i-15], 18) ^ (W[i-15] >>> 3);
      const s1 = rotr(W[i-2], 17) ^ rotr(W[i-2], 19) ^ (W[i-2] >>> 10);
      W[i] = (W[i-16] + s0 + W[i-7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for(let i = 0; i < 64; i++){
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + W[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
    H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, "0")).join("");
}
function pinHash(pin, salt){
  let h = salt + "|" + pin;
  for(let i = 0; i < PIN_ROUNDS; i++) h = sha256hex(salt + h);
  return h;
}
function readParent(){
  try{
    const o = JSON.parse(localStorage.getItem(PARENT_KEY) || "null");
    return o && typeof o.salt === "string" && typeof o.hash === "string" ? o : null;
  }catch(e){ return null; }
}
function validPin(pin){ return /^\d{4}$/.test(String(pin || "")); }
function newSalt(){
  const a = new Uint8Array(16);
  if(window.crypto && window.crypto.getRandomValues) window.crypto.getRandomValues(a);
  else for(let i = 0; i < 16; i++) a[i] = Math.floor(Math.random() * 256);
  return Array.from(a, x => x.toString(16).padStart(2, "0")).join("");
}
function savePin(pin){
  const salt = newSalt();
  try{ localStorage.setItem(PARENT_KEY, JSON.stringify({ v:1, salt, hash:pinHash(pin, salt), setAt:nowIso() })); }
  catch(e){ return false; }
  parentUnlocked = true; writeLock(0, 0);
  return true;
}
function hasPin(){ return !!readParent(); }
function isParentUnlocked(){ return parentUnlocked && hasPin(); }
function lockParent(){ parentUnlocked = false; }
/* page hidden (tab switch, phone locked): close the parent view and the reset permission, except while the phone's file chooser is open */
function onPageHidden(){ lockParent(); if(Date.now() >= pickerUntil) revokeReset(); }
/* first PIN on this device (or a new PIN while unlocked) */
function setPin(pin, again){
  if(hasPin() && !parentUnlocked) return { ok:false, why:"locked" };
  if(!validPin(pin)) return { ok:false, why:"format" };
  if(String(pin) !== String(again)) return { ok:false, why:"mismatch" };
  const first = !hasPin();
  if(!savePin(String(pin))) return { ok:false, why:"storage" };
  if(first) grantReset();   // no PIN existed, so nobody else's PIN is being bypassed
  return { ok:true };
}
function pinWaitSeconds(){ return Math.max(0, Math.ceil((readLock().until - Date.now()) / 1000)); }
function unlockParent(pin){
  const rec = readParent();
  if(!rec) return { ok:false, why:"nopin" };
  if(pinWaitSeconds() > 0) return { ok:false, why:"wait", wait:pinWaitSeconds() };
  if(validPin(pin) && pinHash(String(pin), rec.salt) === rec.hash){ parentUnlocked = true; writeLock(0, 0); grantReset(); return { ok:true }; }
  const fails = readLock().fails + 1;
  if(fails >= PIN_MAX_FAILS){ writeLock(0, Date.now() + PIN_LOCK_MS); return { ok:false, why:"wait", wait:PIN_LOCK_MS / 1000 }; }
  writeLock(fails, 0);
  return { ok:false, why:"wrong", left:PIN_MAX_FAILS - fails };
}
/* 忘记密码: type the parent phrase, then set a new PIN. Pending answers and earlier checks are kept. */
function resetPin(phrase, pin, again){
  if(String(phrase || "").replace(/\s+/g, "") !== PARENT_PHRASE) return { ok:false, why:"phrase" };
  if(!validPin(pin)) return { ok:false, why:"format" };
  if(String(pin) !== String(again)) return { ok:false, why:"mismatch" };
  revokeReset();   // 我是家长 can only change the PIN: it never opens the reset gate and never touches progress
  return savePin(String(pin)) ? { ok:true } : { ok:false, why:"storage" };
}
function bankQ(qid){
  const b = window.PRACTICE_BANK;
  if(!b || !b.idIndex || !Object.prototype.hasOwnProperty.call(b.idIndex, qid)) return null;
  return b.questions[b.idIndex[qid]] || null;
}
window.AnnaProgress = { markQuestion, getMark, percentFor, setMastered, goalFor, getOpen, submitOpen, withdrawOpen, confirmOpen, openList, hasPin, setPin, unlockParent, lockParent, onPageHidden, isParentUnlocked, resetPin, pinWaitSeconds, canResetProgress, submitMulti, revealUnanswered };
window.bootGarden = bootGarden;
</script>
